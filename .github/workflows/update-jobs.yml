name: Refresh remote jobs

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_jobs.py"
      - ".github/workflows/update-jobs.yml"
      - "index.html"

permissions:
  contents: write

concurrency:
  group: refresh-remote-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --upgrade requests
      - name: Collect and validate listings
        run: python scripts/update_jobs.py
      - name: Publish updated job snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then
            echo "No job data changes."
          else
            git commit -m "Refresh remote job listings"
            git pull --rebase origin main
            git push
          fi
